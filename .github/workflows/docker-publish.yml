# Build the app image and publish it to the GitHub Container Registry (GHCR),
# so anyone can run Yoyo Collection without cloning or building — see install.sh
# and the README. Runs on every push to main (tags the image :latest) and on
# every version tag like v1.2.3 (tags :1.2.3, :1.2 and :latest).
#
# The image is multi-arch (amd64 + arm64) so it runs on Intel/AMD servers,
# Apple Silicon, and Raspberry Pi alike. No secrets to configure: the built-in
# GITHUB_TOKEN has just enough scope to push to this repo's package.
#
# ONE-TIME SETUP after the first successful run: make the package public so the
# one-line installer works for everyone —
#   GitHub → this repo → Packages → yoyo-collection → Package settings →
#   Danger Zone → Change visibility → Public.
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower-cased automatically; resolves to ghcr.io/stammig/yoyo-collection.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
