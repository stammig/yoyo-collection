# Run Yoyo Collection with one command — no cloning, no building:
#
#     docker compose up -d
#
# Then open http://localhost:3000.  Your data (database + photos) lives in the
# "yoyo-data" volume and survives restarts and image updates.
#
# Update to the latest version any time with:
#     docker compose pull && docker compose up -d
#
# Prefer to build the image from source instead of pulling it? See
# docker-compose.build.yml.
services:
  yoyo:
    image: ghcr.io/stammig/yoyo-collection:latest
    ports:
      - "3000:3000"
    volumes:
      - yoyo-data:/data
    environment:
      DB_PATH: /data/yoyos.db
      UPLOAD_DIR: /data/uploads
      # Owner login: set a password so the public view is read-only and you log
      # in to edit. Leave unset to run fully open (anyone can edit).
      # ADMIN_PASSWORD: change-me
      #
      # More options — private mode, request throttling, carrier ETA lookups —
      # are listed in .env.example.
    restart: unless-stopped

volumes:
  yoyo-data:
